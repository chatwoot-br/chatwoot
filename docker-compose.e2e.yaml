services:
  rails:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: 'development:test'
        RAILS_ENV: 'production'
        RAILS_SERVE_STATIC_FILES: 'true'
    image: chatwoot:e2e
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gowa:
        condition: service_started
    ports:
      - '3000:3000'
    env_file: .env.e2e
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rm -rf /app/tmp/pids/server.pid
        bundle exec rails db:prepare
        bundle exec rails s -p 3000 -b 0.0.0.0

  gowa:
    image: ghcr.io/chatwoot-br/go-whatsapp-web-multidevice:v8.1.2-1
    environment:
      - APP_PORT=3000
      - APP_HOST=0.0.0.0
      - APP_DEBUG=false
      - APP_OS=Chrome
      - APP_TRUSTED_PROXIES=0.0.0.0/0
      - DB_URI=file:storages/whatsapp.db?_foreign_keys=on
      - WHATSAPP_WEBHOOK=http://rails:3000/webhooks/whatsapp_web
      - WHATSAPP_WEBHOOK_SECRET=e2e-test-secret
      - WHATSAPP_WEBHOOK_INSECURE_SKIP_VERIFY=true
      - WHATSAPP_AUTO_MARK_READ=true
      - WHATSAPP_AUTO_DOWNLOAD_MEDIA=true
      - WHATSAPP_ACCOUNT_VALIDATION=true
      - WHATSAPP_CHAT_STORAGE=true
    volumes:
      - gowa-data:/app/storages

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine

volumes:
  gowa-data:
