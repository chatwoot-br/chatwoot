# https://github.com/microsoft/vscode-dev-containers/blob/master/containers/python-3-postgres/.devcontainer/docker-compose.yml
# https://github.com/microsoft/vscode-dev-containers/blob/master/containers/ruby-rails/.devcontainer/devcontainer.json
#

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: 'ubuntu-22.04'
        NODE_VERSION: '24.14.1'
        RUBY_VERSION: '3.4.4'
        # On Linux, you may need to update USER_UID and USER_GID below if not your local UID is not 1000.
        USER_UID: '1000'
        USER_GID: '1000'

    volumes:
      - ..:/workspace/chatwoot:cached
      - woot-code:/workspace/code

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Port forwarding for devcontainer CLI (forwardPorts only works in VS Code)
    ports:
      - "3000:3000"
      - "3036:3036"
      - "4000:4000"
      - "8025:8025"
      - "37777:37777"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:latest
    restart: unless-stopped
    network_mode: service:db
    volumes:
      - redis-data:/data

  mailhog:
    restart: unless-stopped
    image: mailhog/mailhog
    network_mode: service:db

  gowa:
    image: ghcr.io/chatwoot-br/go-whatsapp-web-multidevice:v8.1.2-1
    restart: unless-stopped
    network_mode: service:db
    environment:
      - APP_PORT=4000
      - APP_HOST=0.0.0.0
      - APP_DEBUG=false
      - APP_OS=Chrome
      - APP_TRUSTED_PROXIES=0.0.0.0/0
      - DB_URI=file:storages/whatsapp.db?_foreign_keys=on
      - WHATSAPP_WEBHOOK=http://localhost:3000/webhooks/whatsapp_web
      - WHATSAPP_WEBHOOK_SECRET=dev-secret
      - WHATSAPP_WEBHOOK_INSECURE_SKIP_VERIFY=true
      - WHATSAPP_AUTO_MARK_READ=true
      - WHATSAPP_AUTO_DOWNLOAD_MEDIA=true
      - WHATSAPP_ACCOUNT_VALIDATION=true
      - WHATSAPP_CHAT_STORAGE=true
    volumes:
      - gowa-data:/app/storages

volumes:
  postgres-data:
  redis-data:
  gowa-data:
  woot-code:
    external: true
