# Docker Compose file for building base images in GitHub Actions
# Usage:
#   docker-compose -f .devcontainer/docker-compose.base.yml build base
#   docker-compose -f .devcontainer/docker-compose.base.yml build devx

services:
  base:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.base
      args:
        VARIANT: 'ubuntu-22.04'
        NODE_VERSION: '24.14.1'
        RUBY_VERSION: '3.4.4'
        USER_UID: '1000'
        USER_GID: '1000'
    image: ghcr.io/chatwoot-br/chatwoot_codespace:latest

  devx:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.devx
    image: ghcr.io/chatwoot-br/chatwoot_codespace_devx:latest
