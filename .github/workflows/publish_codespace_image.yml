name: Publish Devcontainer Images

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/publish_codespace_image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/chatwoot-br/chatwoot_codespace
  DEVX_IMAGE: ghcr.io/chatwoot-br/chatwoot_codespace_devx

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.base
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:latest
            ${{ env.BASE_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:latest
          cache-to: type=inline

  build-devx:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.devx
          push: true
          tags: |
            ${{ env.DEVX_IMAGE }}:latest
            ${{ env.DEVX_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DEVX_IMAGE }}:latest
          cache-to: type=inline
